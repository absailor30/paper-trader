name: Jev report

# Manual, read-only: calibration of the log-only Jev opinions against real
# outcomes (see paper_trader/jev.py). Needs DATABASE_URL, no other secrets.
on:
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Jev report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python run.py jev-report
