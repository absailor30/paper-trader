name: Confidence check

# Manual, read-only: replays the live strategies on ~10y of real data and checks whether higher
# confidence scores preceded better trades (see scripts/confidence_check.py).
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Confidence check
        run: PYTHONPATH=. python -u scripts/confidence_check.py
