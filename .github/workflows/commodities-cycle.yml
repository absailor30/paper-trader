name: Commodities trading cycle

# Separate $100 paper account, monthly rotation top 3 (paper_trader/commodities_orchestrator.py).
# Runs after the US close on weekdays; it only trades on the first run after a month has closed
# (idempotent within a month). State lives in Postgres via DATABASE_URL.
on:
  schedule:
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run one commodities cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTO_EXECUTE: ${{ vars.AUTO_EXECUTE || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py commodities
