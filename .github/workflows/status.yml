name: Portfolio status

# On-demand P&L check: refreshes every open position to its latest price
# (via check_stops_only()/check_all_stops_only(), so a real stop can
# still fire -- same AUTO_EXECUTE gate as every other job here, not a
# separate read-only path) and prints total_value/total_return_pct plus
# per-position unrealized P&L for US, INDIA and CRYPTO. Manual-only: no
# schedule, since P&L doesn't need checking on a fixed cadence the way a
# new-entry cycle does -- trigger it whenever a fresh number is needed
# (e.g. to refresh the live dashboard).

on:
  workflow_dispatch: {}

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh and print portfolio status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTO_EXECUTE: ${{ vars.AUTO_EXECUTE || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py status
