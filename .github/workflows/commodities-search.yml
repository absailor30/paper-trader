name: Commodities search

# Manual-only, read-only backtests (no DB, no orders): commodity funds, in-sample vs last 3 years.
on:
  workflow_dispatch: {}

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Commodities search
        run: PYTHONPATH=. python -u scripts/commodities_search.py
