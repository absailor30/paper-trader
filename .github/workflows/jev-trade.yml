name: Jev trade

# Manual run of the Jev decision accounts (also runs after the daily stocks and
# crypto cycles). Own paper accounts; needs TYPESAFE_API_KEY, otherwise no-ops.
on:
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated: US,INDIA,CRYPTO"
        required: false
        default: "US,INDIA,CRYPTO"

jobs:
  jev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Jev SDK (optional)
        continue-on-error: true
        run: pip install typesafe-sdk
      - name: Jev decision accounts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTO_EXECUTE: ${{ vars.AUTO_EXECUTE || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python run.py jev-trade --markets "${{ inputs.markets }}"
