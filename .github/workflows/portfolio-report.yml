name: Portfolio report

# Manual, read-only: prints every paper account's cash, positions, closed trades and orders.
on:
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Portfolio report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: PYTHONPATH=. python scripts/portfolio_report.py 2>&1 | grep -v "INFO\|WARNING"
