[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid

[program:live_monitor]
command=python src/execution/live_monitor.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/live_monitor.err.log
stdout_logfile=/app/logs/live_monitor.out.log
stopsignal=TERM
stopasgroup=true
killasgroup=true

[program:streamlit_dashboard]
command=streamlit run src/monitoring/dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/dashboard.err.log
stdout_logfile=/app/logs/dashboard.out.log
stopsignal=TERM
stopasgroup=true
killasgroup=true
