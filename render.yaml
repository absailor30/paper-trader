services:
  - type: web
    name: trading-agent
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: 8501
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: MAX_POSITION_SIZE
        value: "0.12"
      - key: MAX_DAILY_LOSS
        value: "0.04"
      - key: STOP_LOSS
        value: "0.06"
      - key: MAX_DRAWDOWN
        value: "0.15"
      - key: US_CAPITAL
        value: "100"
      - key: INDIA_CAPITAL
        value: "10000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
